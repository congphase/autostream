syntax = "proto3";

package autostream;

option java_package = "com.autostream.model";
option java_outer_classname = "TelemetryData";

message VehicleTelemetry {
  // Unique ID of the vehicle (e.g., "VF8-VIN-001")
  string vehicle_id = 1;

  // Unix timestamp in milliseconds
  int64 timestamp = 2;

  // GPS Coordinates
  double latitude = 3;
  double longitude = 4;

  // Current speed in km/h
  double speed = 5;

  // Battery percentage (0.0 to 100.0) - Critical for EVs
  double battery_level = 6;

  // Is the car in Autonomous mode?
  bool is_autonomous = 7;

  // Simulation of Object Detection (simplified)
  // e.g., "PEDESTRIAN", "CAR", "NONE"
  string primary_object_detected = 8;
  
  // Distance to that object in meters
  double object_distance = 9;
}